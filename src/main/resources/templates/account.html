<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account</title>
</head>
<body>
    <h1>Account</h1>
    <p>ID: <span th:text="${account.id}"></span></p>
    <p>Username: <span th:text="${account.username}"></span></p>
    <p>Email: <span th:text="${account.email}"></span></p>
    <p>Profile Name: <span th:text="${account.profileName}"></span></p>
    <p>Created At: <span th:text="${account.createdAt}"></span></p>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</body>
</html>
