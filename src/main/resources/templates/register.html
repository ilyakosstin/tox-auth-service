<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <script>
        function togglePasswordVisibility() {
            var passwordInput = document.getElementById('password');
            var toggleBtn = document.getElementById('togglePasswordBtn');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }
    </script>
</head>
<body>
    <h1>Register</h1>
    <form th:action="@{/register}" method="post">
        <div>
            <label for="username">Login</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="rawPassword">Password</label>
            <input type="password" id="rawPassword" name="rawPassword" required>
            <button type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()">Show</button>
        </div>
        <div>
            <label for="repeatPassword">Repeat Password</label>
            <input type="password" id="repeatPassword" name="repeatPassword" required>
        </div>
        <div>
            <label for="email">Email (optional)</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="profileName">Profile Name (optional)</label>
            <input type="text" id="profileName" name="profileName">
        </div>
        <div>
            <button type="submit">Register</button>
        </div>
    </form>
    <a th:href="@{/login}">Login</a>
</body>
</html>
